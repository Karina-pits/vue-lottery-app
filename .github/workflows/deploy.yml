name: Deploy to GitHub Pages

# Деплой гілок feature/routing та feature/fsd у гілку gh-pages
on:
  push:
    branches: [feature/routing, feature/fsd]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://dummyjson.com
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
